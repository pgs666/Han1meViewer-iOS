name: iOS App Build

on:
  push:
    branches:
      - feature/ios-kmp-mvp
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ios-app:
    name: Build SwiftUI app with KMP framework
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Report runner configuration
        shell: bash
        run: |
          RUNNER_MACOS="$(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          RUNNER_CPU="$(system_profiler SPHardwareDataType | awk -F': ' '/Chip|Processor Name/{print $2; exit}')"
          RUNNER_MODEL="$(sysctl -n hw.model)"
          RUNNER_CORES="$(sysctl -n hw.ncpu)"
          RUNNER_PERF_LEVELS="$(sysctl -n hw.nperflevels 2>/dev/null || true)"
          RUNNER_CPU_TOPOLOGY=""
          if [[ "$RUNNER_PERF_LEVELS" =~ ^[0-9]+$ ]] && (( RUNNER_PERF_LEVELS > 0 )); then
            for ((level = 0; level < RUNNER_PERF_LEVELS; level++)); do
              LEVEL_NAME="$(sysctl -n "hw.perflevel${level}.name" 2>/dev/null || echo "level $level")"
              LEVEL_PHYSICAL="$(sysctl -n "hw.perflevel${level}.physicalcpu" 2>/dev/null || echo "?")"
              LEVEL_LOGICAL="$(sysctl -n "hw.perflevel${level}.logicalcpu" 2>/dev/null || echo "?")"
              [[ -n "$RUNNER_CPU_TOPOLOGY" ]] && RUNNER_CPU_TOPOLOGY+="; "
              RUNNER_CPU_TOPOLOGY+="$LEVEL_NAME: $LEVEL_PHYSICAL physical / $LEVEL_LOGICAL logical"
            done
          else
            RUNNER_CPU_TOPOLOGY="Not exposed by the virtual machine"
          fi
          RUNNER_MEMORY_BYTES="$(sysctl -n hw.memsize)"
          RUNNER_MEMORY="$(awk -v bytes="$RUNNER_MEMORY_BYTES" 'BEGIN { printf "%.1f GiB", bytes / 1073741824 }')"
          RUNNER_DISK="$(df -h / | awk 'NR == 2 { print $2 " total, " $4 " available" }')"
          RUNNER_XCODE="$(xcodebuild -version | paste -sd ' ' -)"
          RUNNER_SWIFT="$(swift --version 2>&1 | sed -n '1p')"
          RUNNER_JAVA="$(java -version 2>&1 | sed -n '1p')"
          RUNNER_GIT="$(git --version)"
          RUNNER_PYTHON="$(python3 --version)"
          RUNNER_HOMEBREW="$(brew --version 2>&1 | sed -n '1p')"

          echo "Runner configuration"
          echo "===================="
          printf '%-18s %s\n' \
            "Runner" "$RUNNER_NAME" \
            "Environment" "$RUNNER_ENVIRONMENT" \
            "OS / architecture" "$RUNNER_OS / $RUNNER_ARCH" \
            "macOS" "$RUNNER_MACOS" \
            "Hardware model" "$RUNNER_MODEL" \
            "Processor" "$RUNNER_CPU" \
            "Logical cores" "$RUNNER_CORES" \
            "CPU topology" "$RUNNER_CPU_TOPOLOGY" \
            "Memory" "$RUNNER_MEMORY" \
            "Root disk" "$RUNNER_DISK" \
            "Xcode" "$RUNNER_XCODE" \
            "Swift" "$RUNNER_SWIFT" \
            "Java (initial)" "$RUNNER_JAVA" \
            "Git" "$RUNNER_GIT" \
            "Python" "$RUNNER_PYTHON" \
            "Homebrew" "$RUNNER_HOMEBREW"

          {
            echo "## Runner configuration"
            echo
            echo "| Category | Value |"
            echo "| --- | --- |"
            echo "| Runner | \`$RUNNER_NAME\` |"
            echo "| Environment | \`$RUNNER_ENVIRONMENT\` |"
            echo "| OS / architecture | \`$RUNNER_OS / $RUNNER_ARCH\` |"
            echo "| macOS | $RUNNER_MACOS |"
            echo "| Hardware model | \`$RUNNER_MODEL\` |"
            echo "| Processor | $RUNNER_CPU |"
            echo "| Logical cores | $RUNNER_CORES |"
            echo "| CPU performance levels | $RUNNER_CPU_TOPOLOGY |"
            echo "| Memory | $RUNNER_MEMORY |"
            echo "| Root disk | $RUNNER_DISK |"
            echo "| Xcode | $RUNNER_XCODE |"
            echo "| Swift | $RUNNER_SWIFT |"
            echo "| Java before setup-java | $RUNNER_JAVA |"
            echo "| Git | $RUNNER_GIT |"
            echo "| Python | $RUNNER_PYTHON |"
            echo "| Homebrew | $RUNNER_HOMEBREW |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native (~/.konan)
        # konan home holds the Kotlin/Native compiler distribution (~250 MB) and
        # platform LLVM caches that take ~100s to redownload+regenerate on every
        # cold run. setup-gradle only caches ~/.gradle, not ~/.konan, so we
        # cache it explicitly here. Key on Kotlin/AGP/library versions because
        # konan is tied to the kotlin compiler version.
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run shared JVM tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          # Stamp the IPA with a dev marker + short commit hash so the
          # Settings → 关于 page shows e.g. "dev (8d7c017)" instead of the
          # static project.yml default "1.0 (1)". Real releases overwrite
          # these in release.yml with the tag version + run number.
          SHORT_SHA="${GITHUB_SHA:0:7}"
          xcodebuild \
            -project Han1meViewer.xcodeproj \
            -scheme Han1meViewer \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            -jobs "$(sysctl -n hw.ncpu)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="dev" \
            CURRENT_PROJECT_VERSION="${SHORT_SHA}" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(pwd)/build/Build/Products/Debug-iphoneos/Han1meViewer.app"
          IPA_DIR="$(pwd)/build/ipa"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          cd "$IPA_DIR"
          /usr/bin/zip -qry Han1meViewer-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: Han1meViewer-unsigned-ipa
          path: build/ipa/Han1meViewer-unsigned.ipa
          if-no-files-found: error
